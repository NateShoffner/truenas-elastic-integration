title: "TrueNAS audit records"
type: logs
streams:
  - input: cel
    title: "TrueNAS audit records"
    description: >-
      Collect audit records from the TrueNAS REST API v2.0 (`POST /api/v2.0/audit/query`).
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: >-
          How often the TrueNAS audit API is polled. Supports duration units, for example `30s`, `5m`, or `1h`.
        required: true
        show_user: true
        default: 5m
      - name: initial_interval
        type: text
        title: Initial Interval
        description: >-
          How far back to look for audit records on the first poll, before a cursor has been stored. Supports duration units, for example `24h` or `168h`.
        required: true
        show_user: false
        default: 24h
      - name: audit_services
        type: text
        title: Audit Services
        description: >-
          TrueNAS audit services to collect. `MIDDLEWARE`, `SMB`, and `SUDO` are available on all supported versions; `SYSTEM` requires TrueNAS 25.10 or later.
        multi: true
        required: true
        show_user: true
        default:
          - MIDDLEWARE
          - SMB
          - SUDO
      - name: batch_size
        type: integer
        title: Batch Size
        description: >-
          Number of audit records requested per API call, sent as `query-options.limit`. The API maximum is 10000.
        required: true
        show_user: false
        default: 1000
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: >-
          Duration before declaring that the HTTP client connection has timed out. Supports duration units, for example `30s`.
        required: false
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracer
        description: >-
          The request tracer logs HTTP requests and responses to the agent's local file system, which is useful for debugging. Enabling it compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - truenas-audit
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        required: false
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false

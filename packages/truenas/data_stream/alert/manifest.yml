title: "TrueNAS alerts"
type: logs
streams:
  - input: cel
    title: "TrueNAS alerts"
    description: >-
      Collect system alerts from the TrueNAS REST API v2.0 (`GET /api/v2.0/alert/list`).
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: >-
          How often the TrueNAS alert API is polled. Supports duration units, for example `30s`, `5m`, or `1h`. The endpoint returns every currently active alert on every call and has no time filter, so this interval is the detection latency for a new alert rather than a throughput setting. Polling more often does not collect more alerts.
        required: true
        show_user: true
        default: 15m
      - name: http_client_timeout
        type: text
        title: HTTP Client Timeout
        description: >-
          Duration before declaring that the HTTP client connection has timed out. Supports duration units, for example `30s`.
        required: false
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable Request Tracer
        description: >-
          The request tracer logs HTTP requests and responses to the agent's local file system, which is useful for debugging. Enabling it compromises security and should only be used for debugging. See [documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-cel.html#_resource_tracer_filename) for details.
        required: false
        show_user: false
        default: false
      - name: tags
        type: text
        title: Tags
        multi: true
        required: true
        show_user: false
        default:
          - forwarded
          - truenas-alert
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        required: false
        show_user: false
elasticsearch:
  index_template:
    mappings:
      subobjects: false

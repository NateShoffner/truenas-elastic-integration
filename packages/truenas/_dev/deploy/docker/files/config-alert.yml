rules:
  # TrueNAS REST API v2.0 alert list mock.
  #
  # The CEL program issues GET /api/v2.0/alert/list with a static Bearer header.
  # The endpoint takes no query parameters and has no pagination, so every
  # request the program makes is byte-for-byte identical. Rounds therefore
  # cannot be distinguished by request matching; they are distinguished with
  # the elastic/stream `.req_num` response template counter instead.
  #
  # The endpoint is a live snapshot: it returns every alert currently active on
  # the system on every call. The CEL program keeps a high-water mark on
  # `last_occurrence` in the cursor and only emits alerts newer than it.
  #
  # Round 1 (req 1, no cursor): 3 alerts, all emitted.
  #   PoolUpgraded   last_occurrence 1784428572000  (dismissed)
  #   ScrubFinished  last_occurrence 1785743385000  <- round 1 high-water mark
  #   ScrubStarted   last_occurrence 1785743101000
  # Round 2 (req 2): 5 alerts. PoolUpgraded and ScrubFinished are unchanged and
  #   must NOT be re-emitted. ScrubStarted recurred (last_occurrence bumped to
  #   1785746400000) and two new alerts appeared, so 3 alerts are emitted.
  #   VolumeStatus   last_occurrence 1785747000000  <- round 2 high-water mark
  #   NTPHealthCheck last_occurrence 1785746700000
  # Round 3+ (req 3..n): the same 5-alert snapshot, unchanged. Nothing is newer
  #   than the persisted high-water mark, so no further alerts are emitted and
  #   the count stays fixed for the rest of the run.
  #
  # Total indexed documents: 3 (round 1) + 3 (round 2) = 6.
  #
  # Cursor regression guard: rounds 3+ replay the full 5-alert snapshot. If the
  # program ever loses or fails to advance the persisted high-water mark it
  # re-emits up to 5 alerts on every 2s poll, pushing hit_count far above the
  # asserted value and failing the test.
  #
  # The round 2 snapshot deliberately exercises the shapes the ingest pipeline
  # has to survive: `args` as a string, as an object and as null; `formatted`
  # containing HTML markup; `source` both empty and populated; and levels drawn
  # from opposite ends of the AlertLevel enum.
  - path: /api/v2.0/alert/list
    methods: ['GET']
    request_headers:
      Authorization:
        - 'Bearer 1-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {{ if eq .req_num 1 }}[{"uuid":"fc27041b-43a2-50fa-9f53-2bdcfbab64b7","source":"","klass":"PoolUpgraded","args":"nas01","node":"nas01","key":"\"nas01\"","datetime":{"$date":1784428572000},"last_occurrence":{"$date":1784428572000},"dismissed":true,"mail":null,"text":"New ZFS version or feature flags are available for pool '%s'. Upgrading pools is a one-time process that can prevent rolling the system back to an earlier TrueNAS version. It is recommended to read the TrueNAS release notes and confirm you need the new ZFS feature flags before upgrading a pool.","id":"fc27041b-43a2-50fa-9f53-2bdcfbab64b7","level":"NOTICE","formatted":"New ZFS version or feature flags are available for pool 'nas01'. Upgrading pools is a one-time process that can prevent rolling the system back to an earlier TrueNAS version. It is recommended to read the TrueNAS release notes and confirm you need the new ZFS feature flags before upgrading a pool.","one_shot":false},{"uuid":"3147381a-e4c1-5c5d-b591-8add87f0e6c5","source":"","klass":"ScrubFinished","args":"freenas-boot","node":"nas01","key":"\"freenas-boot\"","datetime":{"$date":1785743385000},"last_occurrence":{"$date":1785743385000},"dismissed":false,"mail":null,"text":"Scrub of pool %r finished.","id":"3147381a-e4c1-5c5d-b591-8add87f0e6c5","level":"INFO","formatted":"Scrub of pool 'freenas-boot' finished.","one_shot":true},{"uuid":"28ccab3f-1002-5b9e-9fa4-693f70cca2d5","source":"","klass":"ScrubStarted","args":"freenas-boot","node":"nas01","key":"\"freenas-boot\"","datetime":{"$date":1785743101000},"last_occurrence":{"$date":1785743101000},"dismissed":false,"mail":null,"text":"Scrub of pool %r started.","id":"28ccab3f-1002-5b9e-9fa4-693f70cca2d5","level":"INFO","formatted":"Scrub of pool 'freenas-boot' started.","one_shot":true}]{{ else }}[{"uuid":"fc27041b-43a2-50fa-9f53-2bdcfbab64b7","source":"","klass":"PoolUpgraded","args":"nas01","node":"nas01","key":"\"nas01\"","datetime":{"$date":1784428572000},"last_occurrence":{"$date":1784428572000},"dismissed":true,"mail":null,"text":"New ZFS version or feature flags are available for pool '%s'. Upgrading pools is a one-time process that can prevent rolling the system back to an earlier TrueNAS version. It is recommended to read the TrueNAS release notes and confirm you need the new ZFS feature flags before upgrading a pool.","id":"fc27041b-43a2-50fa-9f53-2bdcfbab64b7","level":"NOTICE","formatted":"New ZFS version or feature flags are available for pool 'nas01'. Upgrading pools is a one-time process that can prevent rolling the system back to an earlier TrueNAS version. It is recommended to read the TrueNAS release notes and confirm you need the new ZFS feature flags before upgrading a pool.","one_shot":false},{"uuid":"3147381a-e4c1-5c5d-b591-8add87f0e6c5","source":"","klass":"ScrubFinished","args":"freenas-boot","node":"nas01","key":"\"freenas-boot\"","datetime":{"$date":1785743385000},"last_occurrence":{"$date":1785743385000},"dismissed":false,"mail":null,"text":"Scrub of pool %r finished.","id":"3147381a-e4c1-5c5d-b591-8add87f0e6c5","level":"INFO","formatted":"Scrub of pool 'freenas-boot' finished.","one_shot":true},{"uuid":"28ccab3f-1002-5b9e-9fa4-693f70cca2d5","source":"","klass":"ScrubStarted","args":"freenas-boot","node":"nas01","key":"\"freenas-boot\"","datetime":{"$date":1785743101000},"last_occurrence":{"$date":1785746400000},"dismissed":false,"mail":null,"text":"Scrub of pool %r started.","id":"28ccab3f-1002-5b9e-9fa4-693f70cca2d5","level":"INFO","formatted":"Scrub of pool 'freenas-boot' started.","one_shot":true},{"uuid":"7b6a5c4d-3e2f-51a0-9b8c-7d6e5f4a3b2c","source":"","klass":"VolumeStatus","args":{"volume":"tank","state":"DEGRADED","devices":"<br>raidz1-0<br>  sda  FAULTED  too many errors"},"node":"nas01","key":"{\"volume\": \"tank\"}","datetime":{"$date":1785747000000},"last_occurrence":{"$date":1785747000000},"dismissed":false,"mail":null,"text":"Pool %(volume)s state is %(state)s: %(status)s","id":"7b6a5c4d-3e2f-51a0-9b8c-7d6e5f4a3b2c","level":"CRITICAL","formatted":"Pool tank state is DEGRADED: One or more devices are faulted in response to persistent errors.<br>The following devices are not healthy:<br>raidz1-0<br>  sda  FAULTED  too many errors","one_shot":false},{"uuid":"5a4b3c2d-1e0f-59a8-8b7c-6d5e4f3a2b1c","source":"NTPHealthCheck","klass":"NTPHealthCheck","args":null,"node":"nas01","key":"null","datetime":{"$date":1785746700000},"last_occurrence":{"$date":1785746700000},"dismissed":false,"mail":null,"text":"No NTP peers are reachable.","id":"5a4b3c2d-1e0f-59a8-8b7c-6d5e4f3a2b1c","level":"WARNING","formatted":null,"one_shot":false}]{{ end }}
  # Wrong or missing API key. The TrueNAS middleware answers with HTTP 401 and a
  # text/plain body ("Invalid API key"), not JSON, so the CEL program's error
  # branch must never assume the error body is decodable. Placed last so it only
  # fires when the authenticated rule above did not match.
  - path: /api/v2.0/alert/list
    methods: ['GET']
    responses:
      - status_code: 401
        headers:
          Content-Type:
            - 'text/plain; charset=utf-8'
        body: 'Invalid API key'

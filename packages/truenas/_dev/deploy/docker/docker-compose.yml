version: '2.3'
services:
  truenas-audit-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: truenas-audit-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-audit.yml
  truenas-alert-mock:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: truenas-alert-mock
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-alert.yml
